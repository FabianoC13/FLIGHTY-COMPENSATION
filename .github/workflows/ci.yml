name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  eu261-rules:
    name: EU261 rules (Swift)
    runs-on: ubuntu-latest
    container: swift:6.0
    steps:
      - uses: actions/checkout@v4
      - run: swift test
        working-directory: Tests/EU261Core

  firebase:
    name: Cloud Functions + security rules
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: FlightCompensation/functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FlightCompensation/functions/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm test
      - run: npm run test:rules

  servers:
    name: Payout server (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s server/tests
